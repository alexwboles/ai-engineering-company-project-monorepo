[project]
name = "healthcore-suppliers-api"
version = "0.1.0"
description = "HealthCore supplier directory API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
  "tinydb==4.8.2"
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["routes", "incident_analysis"]
py-modules = ["seed", "main", "models", "database"]
