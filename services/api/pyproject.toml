[project]
name = "healthcore-suppliers-api"
version = "0.1.0"
description = "HealthCore supplier directory API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
  "tinydb==4.8.2",
  "python-jose[cryptography]>=3.5.0",
  "passlib[bcrypt]>=1.7.4",
  "email-validator>=2.3.0",
  "bcrypt<4",
  "resend>=2.4.0",
  "httpx>=0.28.1",
  "pandas>=2.2.3",
  "sqlmodel>=0.0.39",
  "psycopg2-binary>=2.9.12",
  "prefect>=3",
  "celery>=5.6.3",
  "redis>=8.1.0",
  "flower>=2.0.1",
  "markitdown>=0.1.7",
  "py-readability-metrics>=1.4.5",
  "langgraph>=1.2.10",
  "scikit-learn>=1.9.0",
  "matplotlib>=3.11.1",
  "scipy>=1.17.1",
  "qdrant-client>=1.19.0",
  "openai>=2.53.0",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["routes", "incident_analysis"]
py-modules = ["seed", "main", "models", "schemas", "database", "auth_models", "auth_security", "user_service", "email_service", "incidents_service"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
