[project]
name = "healthcore-suppliers-api"
version = "0.1.0"
description = "HealthCore supplier directory API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
  "tinydb==4.8.2",
  "python-jose[cryptography]>=3.5.0",
  "passlib[bcrypt]>=1.7.4",
  "email-validator>=2.3.0",
  "bcrypt<4",
  "resend>=2.4.0",
  "httpx>=0.28.1",
  "pandas>=2.2.3",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["routes", "incident_analysis"]
py-modules = ["seed", "main", "models", "database", "auth_models", "auth_security", "user_service", "email_service", "incidents_service"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
